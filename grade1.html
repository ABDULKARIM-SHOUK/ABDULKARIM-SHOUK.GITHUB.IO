<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>قطار الإنجليزية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Lalezar&display=swap">
<style>
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{background:var(--bg-img,none),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
svg{fill:currentColor;display:block}
.en{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate}
.wrap{max-width:640px;margin-inline:auto;padding-block:14px 120px;position:relative;z-index:1}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:var(--gh,0px);background:var(--ground,none) repeat-x center bottom/auto 100%;pointer-events:none;z-index:0}
.scene{margin-block:12px 0;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);line-height:0;border:3px solid var(--scene-bd,#fff)}
.scene svg{width:100%;height:auto;display:block;direction:ltr}
.namebox .scene{width:100%;margin-block:0 6px}
.path{position:relative}
.path::before{content:"";position:absolute;inset-block:34px;inset-inline-start:calc(50% - var(--tw,6px) / 2);width:var(--tw,6px);background:var(--trail,none);border-radius:99px;z-index:0}
.wrap.q{padding-bottom:260px}
.screen{animation:fade .25s ease-out}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:var(--r-btn);background:var(--a1);color:var(--on-a1);font-family:var(--font-display);font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 var(--a1-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--a1-deep)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.full{width:100%}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.alt:active{box-shadow:0 1px 0 var(--line)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.brand{font-family:var(--font-display);font-size:1.5rem;font-weight:800;line-height:1.2;flex:1 1 140px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--card);font-weight:800;box-shadow:var(--shadow-s);font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px;color:var(--gold)}
.round{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow-s)}
.round svg{width:22px;height:22px}

/* hero */
.hero{display:flex;gap:12px;align-items:center;margin-block:14px}
.mascot{font-size:3.6rem;line-height:1;animation:bob 2.6s ease-in-out infinite;flex:none}
.bubble{position:relative;background:var(--card);padding:12px 16px;border-radius:var(--r);box-shadow:var(--shadow);font-weight:700;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;inset-inline-start:-7px;top:22px;width:16px;height:16px;background:var(--card);transform:rotate(45deg);border-radius:3px}
.go{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--a1);color:var(--on-a1);border-radius:var(--r);padding:14px 16px;box-shadow:0 6px 0 var(--a1-deep);transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--a1-deep)}
.go .gt{flex:1;min-width:0}
.go + .meter{margin-inline:16px}
.go small{display:block;opacity:.85;font-weight:700}
.go b{font-family:var(--font-display);font-size:1.25rem;line-height:1.3}
.go svg{width:30px;height:30px;flex:none}
.meter{height:14px;border-radius:99px;background:var(--track);margin-top:14px}
.meter i{display:block;position:relative;height:100%;width:var(--w,0%);background:var(--a2);border-radius:99px;transition:width .6s ease}
.meter i::after{content:var(--veh,none);position:absolute;inset-inline-end:-15px;top:50%;translate:0 -52%;font-size:26px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.mlabel{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-top:6px;color:var(--muted)}
h2.sec{font-family:var(--font-display);font-size:1.3rem;margin:26px 0 10px;line-height:1.3}

/* level path */
.path{display:flex;flex-direction:column;gap:20px;margin-block:12px}
.node{display:flex;align-items:center;gap:14px;width:88%;text-align:start;padding:12px 14px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);position:relative;transition:transform .12s}
.node:nth-child(even){margin-inline-start:auto}
.node:not(.locked):active{transform:scale(.97)}
.orb{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:var(--lv,var(--a1));box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 4px 0 rgba(0,0,0,.12);position:relative}
.orb .no{position:absolute;inset-inline-end:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--ink);font:800 .8rem var(--font-en);display:grid;place-items:center;box-shadow:var(--shadow-s)}
.node .meta{min-width:0;flex:1}
.node h3{margin:0;font-family:var(--font-display);font-size:1.12rem;line-height:1.3}
.node p{margin:2px 0 0;color:var(--muted);font-size:.9rem;line-height:1.4}
.node.locked{filter:grayscale(.9);cursor:not-allowed;background:var(--card2);background:color-mix(in srgb,var(--card) 64%,var(--bg))}
.node.locked>*{opacity:.6}
.node .lk{width:22px;height:22px;color:var(--muted);flex:none}
.stars{display:flex;gap:2px;margin-top:4px}
.st svg{width:22px;height:22px;fill:var(--star-off)}
.st.on svg{fill:var(--gold)}
.cefr{direction:ltr;unicode-bidi:isolate;font:800 .75rem var(--font-en);padding:3px 9px;border-radius:99px;background:var(--a2);color:var(--on-a2);letter-spacing:.04em;flex:none}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bd{background:var(--card);border-radius:var(--r);padding:12px 6px;text-align:center;font-size:.82rem;font-weight:700;box-shadow:var(--shadow-s);line-height:1.35}
.bd .e{font-size:2rem;display:block;line-height:1.2}
.bd.off{filter:grayscale(1);opacity:.45}
.foot{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.link{font-size:.85rem;color:var(--muted);text-decoration:underline;padding:8px 10px}

/* learn screen */
.lvh{flex:1;min-width:0}
.lvh .t{font-family:var(--font-display);font-size:1.35rem;line-height:1.3;font-weight:800}
.lvh .s{color:var(--muted);font-size:.92rem}
.qtop{display:flex;align-items:center;gap:12px;margin-block:6px 16px}
.hint{color:var(--muted);font-weight:700;font-size:.92rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.wc{background:var(--card);border-radius:var(--r);padding:14px 8px 12px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0;transition:transform .1s}
.wc:active{transform:scale(.95)}
.wc.say{animation:pop .4s}
.wc .em{font-size:2.8rem;line-height:1.15}
.wc .w{font-family:var(--font-en);font-weight:800;font-size:1.25rem;direction:ltr;overflow-wrap:anywhere;line-height:1.3}
.wc .m{color:var(--muted);font-size:.95rem;font-weight:700}
.wc .k{font:800 1.05rem var(--font-en);background:var(--a2);color:var(--on-a2);border-radius:10px;padding:0 10px}
.tip{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);margin-block:14px}
.tip h4{margin:0 0 6px;font-family:var(--font-display);font-size:1.15rem;line-height:1.4}
.tip p{margin:0 0 8px}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed var(--line)}
.exb{flex:1;min-width:0}
.exb .en{font-weight:800;font-size:1.1rem;text-align:right}
.exa{color:var(--muted);font-size:.92rem}
.spk{flex:none;width:44px;height:44px;border-radius:50%;background:var(--a2);color:var(--on-a2);display:grid;place-items:center;box-shadow:0 3px 0 var(--a2-deep);transition:transform .08s}
.spk:active{transform:translateY(3px);box-shadow:none}
.spk svg{width:22px;height:22px}
.spk.lg{width:72px;height:72px}
.spk.lg svg{width:36px;height:36px}
.spk.slow{background:var(--card2);color:var(--ink);box-shadow:0 3px 0 var(--line);font-size:1.3rem}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 62%,transparent);z-index:20}
.dock-in{max-width:640px;margin-inline:auto;display:flex;gap:10px}
.dock-in .btn{flex:1}

/* quiz */
.qbar{flex:1;min-width:0}
.qbar .meter{margin-inline:16px!important}
.qcount{font-weight:800;min-width:3.4ch;text-align:center;font-variant-numeric:tabular-nums}
.qprompt{font-family:var(--font-display);font-size:1.3rem;margin:4px 0 14px;text-align:center;line-height:1.5;font-weight:800}
.again{display:inline-block;margin-inline-start:8px;font-size:.8rem;background:var(--a2);color:var(--on-a2);padding:2px 10px;border-radius:99px;vertical-align:middle}
.qcard{background:var(--card);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.big{font-size:5.2rem;line-height:1.1}
.big.sm{font-size:3.2rem;letter-spacing:4px}
.qtext{font-family:var(--font-en);font-size:1.5rem;font-weight:800;direction:ltr;line-height:1.5;overflow-wrap:anywhere}
.qtext.ar{font-family:var(--font-ui);direction:rtl}
.passage{text-align:left;direction:ltr;font-family:var(--font-en);line-height:1.8;background:var(--card2);padding:12px 14px;border-radius:14px;font-size:1.05rem;white-space:pre-line;width:100%}
.spkrow{display:flex;gap:10px;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opts.one{grid-template-columns:1fr}
.opt{padding:14px 10px;min-height:64px;border-radius:var(--r);background:var(--card);box-shadow:0 4px 0 var(--line),var(--shadow-s);font-weight:800;font-size:1.2rem;display:flex;align-items:center;justify-content:center;text-align:center;border:3px solid transparent;transition:transform .08s;overflow-wrap:anywhere;min-width:0}
.opt:active{transform:translateY(3px)}
.opt.en{font-family:var(--font-en);font-size:1.3rem}
.opt.emo{font-size:3.2rem;min-height:96px}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.5}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr;min-height:58px;margin-top:16px}
.slot{min-width:46px;height:54px;border-radius:12px;border:3px dashed var(--line);background:var(--card2);display:grid;place-items:center;font-family:var(--font-en);font-weight:800;font-size:1.35rem;padding-inline:10px;color:var(--ink)}
.slot.f{border-style:solid;border-color:var(--a2);background:var(--card)}
.slot.good{border-color:var(--good);background:var(--good-bg)}
.slot.bad{border-color:var(--bad);background:var(--bad-bg)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:ltr;margin-top:18px}
.tile{min-width:48px;height:54px;padding-inline:14px;border-radius:12px;background:var(--a2);color:var(--on-a2);font-family:var(--font-en);font-weight:800;font-size:1.3rem;box-shadow:0 4px 0 var(--a2-deep);transition:transform .08s}
.tile:active{transform:translateY(3px)}
.tile.used{opacity:.2;pointer-events:none}
.brow{display:flex;gap:10px;justify-content:center;margin-top:18px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.mc{display:flex;flex-direction:column;gap:12px;min-width:0}
.m-i{min-height:60px;padding:8px;border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--line),var(--shadow-s);display:grid;place-items:center;font-weight:800;font-size:1.1rem;border:3px solid transparent;overflow-wrap:anywhere;text-align:center;min-width:0}
.m-i.en{font-family:var(--font-en);font-size:1.2rem}
.m-i.emo{font-size:2.2rem}
.m-i.sel{border-color:var(--a1);transform:scale(1.04)}
.m-i.ok{background:var(--good-bg);border-color:var(--good);pointer-events:none}
.m-i.no{animation:shake .35s;border-color:var(--bad)}
.inp{width:100%;padding:14px;border-radius:14px;border:3px solid var(--line);background:var(--card2);color:var(--ink);font:800 1.4rem var(--font-en);direction:ltr;text-align:center;margin-top:16px}
.inp.good{border-color:var(--good);background:var(--good-bg)}
.inp.bad{border-color:var(--bad);background:var(--bad-bg)}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:30;animation:rise .28s ease-out;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.sheet.good{background:var(--good-bg);color:var(--good-ink)}
.sheet.bad{background:var(--bad-bg);color:var(--bad-ink)}
.sheet-in{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:6px}
.sh-t{font-family:var(--font-display);font-size:1.4rem;font-weight:800}
.sh-a,.sh-fb,.sh-tip{font-weight:700}
.sh-fb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet .btn{margin-top:8px}
.sheet.good .btn{background:var(--good);box-shadow:0 5px 0 var(--good-deep);color:#fff}
.sheet.bad .btn{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep);color:#fff}

/* result */
.res{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:24px}
.res h1{font-family:var(--font-display);font-size:1.9rem;margin:0;line-height:1.3}
.bigstars{display:flex;gap:8px;direction:ltr;align-items:flex-end}
.bigstars svg{width:84px;height:84px;fill:var(--star-off)}
.bigstars svg.on{fill:var(--gold);animation:starpop .55s both;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.bigstars svg:nth-child(2){margin-bottom:18px}
.bigstars svg.on:nth-child(1){animation-delay:.1s}.bigstars svg.on:nth-child(2){animation-delay:.4s}.bigstars svg.on:nth-child(3){animation-delay:.7s}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{background:var(--card);border-radius:var(--r);padding:10px 18px;box-shadow:var(--shadow-s);font-weight:800;min-width:110px}
.stat b{direction:ltr;unicode-bidi:isolate;display:block;font-size:1.5rem;font-family:var(--font-display)}
.stat span{color:var(--muted);font-size:.85rem}
.res .btn{min-width:240px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--a1);color:var(--on-a1);padding:10px 20px;border-radius:99px;font-weight:800;box-shadow:var(--shadow);z-index:60;animation:drop .4s;max-width:90vw;text-align:center}
.cf{position:fixed;inset:0;pointer-events:none;z-index:70}

/* name screen */
.namebox{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:28px}
.namebox .bubble::before{display:none}
.namebox .bubble{width:100%;font-size:1.15rem}
.mascot.huge{font-size:6.4rem}
.namebox .btn{min-width:220px}
.inp.ar{direction:rtl;font-family:var(--font-ui);font-size:1.5rem;margin-top:0}
.note{margin:0;color:var(--on-bg-2,var(--muted));font-size:.85rem;font-weight:700}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes drop{from{transform:translate(-50%,-80px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:380px){.big{font-size:4.4rem}.node{width:94%}.opt.emo{font-size:2.6rem}}

/* Theme: little train. Warm cream sky with polka dots, strawberry buttons, rounded toy shapes, single look by choice. */
:root{
  --bg:#FFF2CF;
  --bg-img:radial-gradient(circle at 18px 18px,rgba(255,255,255,.75) 5px,transparent 6px),linear-gradient(#FFE6A0 0,#FFF6DC 42%,#E4F5EA 100%);
  --ink:#2B2350; --muted:#5A5285; --card:#FFFFFF; --card2:#FFF7E3; --line:#EBDDB5; --track:rgba(255,255,255,.85);
  --a1:#D6336C; --a1-deep:#9C1F4B; --on-a1:#FFFFFF;
  --a2:#0E8F9B; --a2-deep:#096871; --on-a2:#FFFFFF;
  --good:#1F9D45; --good-deep:#14702F; --good-bg:#DDF7E3; --good-ink:#0D4A21;
  --bad:#E5484D; --bad-deep:#B02A2F; --bad-bg:#FFE4E2; --bad-ink:#7A1417;
  --gold:#FFB703; --star-off:#E6DCC0; --focus:#6D3FE0;
  --r:26px; --r-btn:22px;
  --shadow:0 6px 0 rgba(43,35,80,.1),0 12px 24px rgba(43,35,80,.08); --shadow-s:0 3px 0 rgba(43,35,80,.12);
  --font-ui:'Cairo','Tajawal',system-ui,sans-serif;
  --font-display:'Lalezar','Cairo',system-ui,sans-serif;
  --font-en:'Fredoka','Cairo',system-ui,sans-serif;
}
body{font-size:17px;font-weight:600;background-size:44px 44px,100% 100%,auto}
.brand,h2.sec,.btn,.node h3,.qprompt,.sh-t,.go b,.lvh .t,.tip h4,.res h1,.stat b{font-weight:400;font-synthesis:none;letter-spacing:.01em}
.brand::before{content:"🚂 "}
.brand{font-size:1.9rem;color:#A3154A;text-shadow:0 2px 0 #fff}
h2.sec{font-size:1.5rem}
.qprompt{font-size:1.5rem}
.mascot{font-size:4.8rem}
.orb{border:4px solid #fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.65),transparent 40%),var(--lv)}
.node,.qcard,.wc,.tip{border:3px solid #fff}
.wc .em{font-size:3.8rem}
.wc .w{font-size:1.45rem}
.big{font-size:6.4rem}
.opt.en{font-size:1.5rem}
.opt{border-radius:28px}
.btn{font-size:1.35rem;padding:14px 28px}
.cefr{display:none}
.meter{height:18px;background:rgba(255,255,255,.85)}

    C.scene ? h('div', { class: 'scene', 'aria-hidden': 'true', html: C.scene }) : null,
    h('div', { class: 'hero' }, h('div', { class: 'mascot', 'aria-hidden': 'true' }, C.mascot), h('div', { class: 'bubble' }, line)),
    h('button', { class: 'go', onclick: () => openLevel(ci) },
      h('span', { class: 'orb', style: '--lv:' + (cl.color || 'var(--a2)') + ';width:56px;height:56px;font-size:1.7rem' }, cl.emoji),
      h('span', { class: 'gt' }, h('small', null, got ? 'كمّل رحلتك' : 'ابدأ رحلتك'), h('b', null, cl.title)), ic('go')),
    h('div', { class: 'meter', role: 'progressbar', 'aria-valuenow': pct, 'aria-valuemin': 0, 'aria-valuemax': 100, style: '--w:' + pct + '%' }, h('i')),
    h('div', { class: 'mlabel' }, h('span', null, C.journey), h('span', null, pct + '%')),
    h('h2', { class: 'sec' }, C.pathTitle),
    h('div', { class: 'path' }, C.levels.map((l, i) => {
      const open = isOpen(i), n = S.stars[l.id] || 0;
      return h('button', { class: 'node' + (open ? '' : ' locked'), disabled: !open, 'aria-label': l.title, onclick: () => openLevel(i) },
        h('span', { class: 'orb', style: '--lv:' + (l.color || 'var(--a1)') }, l.emoji, h('span', { class: 'no' }, i + 1)),
        h('span', { class: 'meta' }, h('h3', null, l.title), h('p', null, l.sub), open ? starRow(n) : null),
        open ? h('span', { class: 'cefr' }, l.cefr) : h('span', { class: 'lk', html: ICON.lock }));
    })),
    h('h2', { class: 'sec' }, 'أوسمتك'),
    h('div', { class: 'badges' }, BADGES.map(b => h('div', { class: 'bd' + (S.badges.includes(b.id) ? '' : ' off'), title: b.d }, h('span', { class: 'e' }, b.e), b.t))),
    h('div', { class: 'foot' },
      C.askName ? h('button', { class: 'link', onclick: () => nameScreen(true) }, 'تغيير الاسم') : null,
      h('button', { class: 'link', onclick: e => { S.open = !S.open; save(); home(); } }, S.open ? 'ولي الأمر: إعادة قفل المراحل' : 'ولي الأمر: فتح جميع المراحل'),
      resetBtn()));
  mount(node);
}
function resetBtn() {
  const b = h('button', { class: 'link' }, 'مسح التقدم');
  let armed = false;
  b.onclick = () => {
    if (!armed) { armed = true; b.textContent = 'اضغط مرة أخرى للتأكيد'; setTimeout(() => { armed = false; b.textContent = 'مسح التقدم'; }, 4000); return; }
    S = { xp: 0, stars: {}, badges: [], streak: 0, last: '', sound: S.sound, open: false, name: S.name }; save(); home();
  };
  return b;
}

/* ---------- level: learn ---------- */
function openLevel(i) {
  if (!isOpen(i)) return;
  const l = C.levels[i], vs = (l.vocab || []).map(toV);
  const card = v => {
    const el = h('button', { class: 'wc', 'aria-label': v.en + ' ' + v.ar },
      v.k ? h('span', { class: 'k' }, v.k) : null, v.em ? h('span', { class: 'em' }, v.em) : null, h('span', { class: 'w' }, v.en), h('span', { class: 'm' }, v.ar));
    el.onclick = () => { say(v.en, { force: true }); el.classList.remove('say'); void el.offsetWidth; el.classList.add('say'); };
    return el;
  };
  const tipCard = t => h('div', { class: 'tip' }, h('h4', null, '💡 ' + t.t), t.b ? h('p', null, t.b) : null,
    (t.ex || []).map(e => h('div', { class: 'ex' }, spk(e[0]), h('div', { class: 'exb' }, h('div', { class: 'en' }, e[0]), h('div', { class: 'exa' }, e[1])))));
  const playAll = () => { try { speechSynthesis.cancel(); } catch (e) {} vs.forEach(v => say(v.en, { force: true, queue: true })); };
  const node = h('div', { class: 'wrap screen' },
    h('div', { class: 'qtop' }, backBtn(home), h('div', { class: 'lvh' }, h('div', { class: 't' }, l.title), h('div', { class: 's' }, l.sub)), h('span', { class: 'cefr' }, l.cefr)),
    vs.length ? h('h2', { class: 'sec' }, C.learnTitle) : null,
    vs.length ? h('p', { class: 'hint' }, 'اضغط على البطاقة لتسمع النطق، ثم كرّر الكلمة بصوت عالٍ.') : null,
    vs.length && HAS_TTS ? h('p', null, h('button', { class: 'btn alt', onclick: playAll }, ic('spk', 'ic'), 'استمع لكل الكلمات')) : null,
    vs.length ? h('div', { class: 'grid' }, vs.map(card)) : null,
    (l.tips || []).length ? h('h2', { class: 'sec' }, 'قاعدة سريعة') : null,
    (l.tips || []).map(tipCard),
    h('div', { class: 'dock' }, h('div', { class: 'dock-in' }, h('button', { class: 'btn', onclick: () => startQuiz(l, i) }, C.startLabel))));
  node.querySelectorAll('.btn .ic').forEach(x => { x.style.cssText = 'width:22px;height:22px;display:inline-block'; });
  mount(node);
}

/* ---------- quiz ---------- */
function startQuiz(l, idx) {
  const qs = buildQuiz(l);
  next({ l, idx, queue: qs.slice(), total: qs.length, mastered: 0, first: 0, xp: 0, n: 0 });
}
function next(run) {
  if (!run.queue.length) return finish(run);
  run.q = run.queue.shift(); run.n++;
  renderQ(run, run.q);
}
function qHead(q) {
  const c = h('div', { class: 'qcard' });
  if (q.passage) c.append(h('div', { class: 'passage' }, q.passage), spk(q.passage));
  if (q.big) c.append(h('div', { class: 'big' + ([...q.big].length > 3 ? ' sm' : '') }, q.big));
  if (q.text) c.append(h('div', { class: 'qtext' + (q.textAr ? ' ar' : '') }, q.text));
  const s = q.listen || q.say;
  if (s && HAS_TTS) c.append(h('div', { class: 'spkrow' }, spk(s, q.listen ? 'lg' : ''), q.listen ? slowBtn(s) : null));
  return c;
}
const correctText = q => q.kind === 'choice' ? q.a : q.kind === 'build' ? q.ans.join(q.join) : q.answers[0];
function resolve(run, q, ok, extra) {
  const wasFirst = extra && 'first' in extra ? extra.first : !q._tries;
  if (ok) { run.mastered++; if (wasFirst) { run.first++; run.xp += C.xpOk || 10; } else run.xp += 5; sfx('ok'); }
  else {
    sfx('no'); q._tries = (q._tries || 0) + 1;
    if (q._tries < 2 && q.kind !== 'match') { const c = Object.assign({}, q); if (c.opts) c.opts = shuffle(c.opts); if (c.units && c.kind === 'build') c.units = shuffle(c.units); run.queue.push(c); }
    else run.mastered++;
  }
  const bar = document.querySelector('.meter');
  if (bar) bar.style.setProperty('--w', Math.round(run.mastered / run.total * 100) + '%');
  document.querySelector('.qcount').textContent = run.mastered + '/' + run.total;
  sheet(run, q, ok);
}
function sheet(run, q, ok) {
  const fb = q.fb;
  const sh = h('div', { class: 'sheet ' + (ok ? 'good' : 'bad'), role: 'status', 'aria-live': 'polite' }, h('div', { class: 'sheet-in' },
    h('div', { class: 'sh-t' }, fill(ok ? rnd(C.praise) : rnd(C.oops))),
    !ok && q.kind !== 'match' ? h('div', { class: 'sh-a' }, 'الإجابة الصحيحة: ', h('span', { class: q.oc === 'ar' ? '' : 'en' }, correctText(q))) : null,
    fb ? h('div', { class: 'sh-fb' }, fb.em || '', h('span', { class: 'en' }, fb.en), '=', h('span', null, fb.ar)) : null,
    q.tip ? h('div', { class: 'sh-tip' }, '💡 ' + q.tip) : null,
    h('button', { class: 'btn full', onclick: () => next(run) }, run.queue.length ? 'متابعة' : 'إنهاء')));
  app.append(sh);
  if (q.speak) setTimeout(() => say(q.speak), 450);
}
function renderQ(run, q) {
  const body = q.kind === 'choice' ? rChoice(run, q) : q.kind === 'build' ? rBuild(run, q) : q.kind === 'match' ? rMatch(run, q) : rType(run, q);
  let armed = false;
  const x = h('button', { class: 'round', 'aria-label': 'خروج', onclick: () => {
    if (!armed) { armed = true; toast('اضغط مرة أخرى للخروج من التحدي'); setTimeout(() => armed = false, 2500); return; }
    openLevel(run.idx);
  } }, ic('x'));
  const node = h('div', { class: 'wrap q screen' },
    h('div', { class: 'qtop' }, x, h('div', { class: 'qbar' }, h('div', { class: 'meter', style: '--w:' + Math.round(run.mastered / run.total * 100) + '%;margin:0' }, h('i'))), h('span', { class: 'qcount' }, run.mastered + '/' + run.total)),
    h('div', { class: 'qprompt' }, q.prompt, q._tries ? h('span', { class: 'again' }, 'محاولة جديدة') : null),
    body);
  mount(node);
  if (q.listen) setTimeout(() => say(q.listen), 450);
}
function rChoice(run, q) {
  let locked = false;
  const opts = h('div', { class: 'opts' + (q.opts.some(o => o.length > 22) ? ' one' : '') });
  q.opts.forEach(o => {
    const b = h('button', { class: 'opt ' + q.oc, 'data-v': o }, o);
    b.onclick = () => {
      if (locked) return; locked = true;
      const ok = o === q.a;
      b.classList.add(ok ? 'good' : 'bad');
      [...opts.children].forEach(x => { if (x.dataset.v === q.a) x.classList.add('good'); else if (x !== b) x.classList.add('dim'); });
      resolve(run, q, ok);
    };
    opts.append(b);
  });
  return h('div', null, qHead(q), opts);
}
function rBuild(run, q) {
  const placed = [], n = q.ans.length;
  const slots = h('div', { class: 'slots' }), bank = h('div', { class: 'bank' });
  let locked = false;
  const tiles = q.units.map((u, i) => h('button', { class: 'tile', onclick: () => { if (locked || placed.length >= n) return; sfx('tap'); placed.push(i); paint(); } }, u));
  tiles.forEach(t => bank.append(t));
  const check = h('button', { class: 'btn', disabled: true, onclick: () => {
    if (locked) return; locked = true;
    const guess = placed.map(i => q.units[i]).join(q.join), ok = guess === q.ans.join(q.join);
    [...slots.children].forEach(s => s.classList.add(ok ? 'good' : 'bad'));
    check.disabled = true; reset.disabled = true;
    resolve(run, q, ok);
  } }, 'تحقق');
  const reset = h('button', { class: 'btn alt', onclick: () => { if (locked) return; placed.length = 0; paint(); } }, 'إعادة');
  function paint() {
    slots.replaceChildren(...Array.from({ length: n }, (_, k) => placed[k] == null ? h('div', { class: 'slot', 'aria-hidden': 'true' }) :
      h('button', { class: 'slot f', onclick: () => { if (locked) return; placed.splice(k, 1); paint(); } }, q.units[placed[k]])));
    tiles.forEach((t, i) => t.classList.toggle('used', placed.includes(i)));
    check.disabled = placed.length !== n;
  }
  paint();
  return h('div', null, qHead(q), slots, bank, h('div', { class: 'brow' }, reset, check));
}
function rMatch(run, q) {
  const L = q.pairs.map((p, i) => ({ i, t: p[0] })), R = shuffle(q.pairs.map((p, i) => ({ i, t: p[1] })));
  let sel = null, mistakes = 0, matched = 0;
  const colL = h('div', { class: 'mc' }), colR = h('div', { class: 'mc' });
  const mk = (o, side) => {
    const b = h('button', { class: 'm-i ' + (side === 'L' ? 'en' : q.right) }, o.t);
    b.onclick = () => {
      if (side === 'L') { sel = { el: b, o }; colL.querySelectorAll('.m-i').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); say(o.t, { force: true }); return; }
      if (!sel) { sfx('tap'); return; }
      if (sel.o.i === o.i) {
        sfx('ok'); sel.el.classList.remove('sel'); sel.el.classList.add('ok'); b.classList.add('ok'); sel = null; matched++;
        if (matched === L.length) setTimeout(() => resolve(run, q, true, { first: mistakes === 0 }), 350);
      } else { mistakes++; sfx('no'); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); }
    };
    return b;
  };
  L.forEach(o => colL.append(mk(o, 'L'))); R.forEach(o => colR.append(mk(o, 'R')));
  return h('div', null, h('div', { class: 'mt' }, colL, colR));
}
function rType(run, q) {
  let locked = false;
  const inp = h('input', { class: 'inp', id: 'ans', type: 'text', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', 'aria-label': 'اكتب إجابتك هنا' });
  const go = () => {
    if (locked || !inp.value.trim()) return; locked = true; inp.disabled = true;
    const ok = q.answers.some(a => norm(a) === norm(inp.value));
    inp.classList.add(ok ? 'good' : 'bad'); btn.disabled = true; resolve(run, q, ok);
  };
  const btn = h('button', { class: 'btn', style: 'margin-top:14px', onclick: go }, 'تحقق');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  return h('div', null, qHead(q), inp, h('div', { class: 'brow' }, btn));
}

/* ---------- result ---------- */
function touchStreak() {
  const t = today();
  if (S.last === t) return;
  const y = new Date(Date.now() - 864e5).toLocaleDateString('en-CA');
  S.streak = S.last === y ? S.streak + 1 : 1; S.last = t;
}
function finish(run) {
  const acc = run.first / run.total, stars = acc >= .9 ? 3 : acc >= .7 ? 2 : acc >= .5 ? 1 : 0;
  const prev = S.stars[run.l.id] || 0;
  S.stars[run.l.id] = Math.max(prev, stars);
  const bonus = stars > 0 ? 20 : 0;
  S.xp += run.xp + bonus; touchStreak();
  const fresh = checkBadges(); save();
  const last = run.idx === C.levels.length - 1, nextIdx = run.idx + 1;
  const msgs = C.result;
  const node = h('div', { class: 'wrap screen' }, h('div', { class: 'res' },
    h('div', { class: 'mascot', 'aria-hidden': 'true' }, C.mascot),
    h('h1', null, fill(stars === 3 ? msgs[3] : stars === 2 ? msgs[2] : stars === 1 ? msgs[1] : msgs[0])),
    h('div', { class: 'bigstars', 'aria-label': stars + ' من 3 نجوم' }, [1, 2, 3].map(i => h('span', { html: ICON.star }).firstChild).map((svg, i) => { if (i < stars) svg.setAttribute('class', 'on'); return svg; })),
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', null, Math.round(acc * 100) + '%'), h('span', null, 'إجابات من أول مرة')),
      h('div', { class: 'stat' }, h('b', null, '+' + (run.xp + bonus)), h('span', null, 'نقطة'))),
    fresh.length ? h('div', { class: 'bubble' }, 'وسام جديد! ' + fresh.map(b => b.e + ' ' + b.t).join(' ، ')) : null,
    stars > 0 && !last ? h('button', { class: 'btn', onclick: () => openLevel(nextIdx) }, 'المرحلة التالية') : null,
    stars > 0 && last ? h('div', { class: 'bubble' }, fill(C.finale)) : null,
    stars === 0 ? h('button', { class: 'btn', onclick: () => openLevel(run.idx) }, 'راجع البطاقات') : null,
    h('button', { class: 'btn alt', onclick: () => startQuiz(run.l, run.idx) }, stars === 3 ? 'العب مرة أخرى' : 'حاول لتحصل على نجوم أكثر'),
    h('button', { class: 'link', onclick: home }, 'القائمة الرئيسية')));
  mount(node);
  if (stars > 0) { sfx('win'); confetti(); setTimeout(() => say(C.sayWin), 700); if (fresh.length) setTimeout(() => { sfx('badge'); toast('وسام جديد: ' + fresh[0].e + ' ' + fresh[0].t); }, 1600); }
  else sfx('no');
}

/* ---------- name screen (student types the name; kept on this device) ---------- */
function nameScreen(editing) {
  const inp = h('input', { class: 'inp ar', id: 'student-name', type: 'text', maxlength: '20', autocomplete: 'off', spellcheck: 'false',
    placeholder: 'اكتب اسمك هنا', 'aria-label': 'اسم الطالب', value: editing ? nm() : false });
  const clean = () => inp.value.replace(/\s+/g, ' ').trim().slice(0, 20);
  const go = () => { const v = clean(); if (!v) { inp.focus(); return; } S.name = v; save(); sfx('ok'); home(); };
  const btn = h('button', { class: 'btn', onclick: go }, C.nameBtn || 'هيا نبدأ');
  const sync = () => { btn.disabled = !clean(); };
  inp.addEventListener('input', sync);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  mount(h('div', { class: 'wrap screen' }, h('div', { class: 'namebox' },
    C.scene ? h('div', { class: 'scene', 'aria-hidden': 'true', html: C.scene }) : null,
    h('div', { class: 'mascot huge', 'aria-hidden': 'true' }, C.mascot),
    h('div', { class: 'bubble' }, editing ? 'اكتب الاسم الجديد' : C.nameAsk),
    inp, btn,
    editing ? h('button', { class: 'link', onclick: home }, 'رجوع دون تغيير') : null,
    h('p', { class: 'note' }, 'يُحفظ الاسم على هذا الجهاز فقط ويظهر في التحيات داخل الدروس.'))));
  sync();
  if (!editing) setTimeout(() => inp.focus(), 250);
}

if (C.askName && !nm()) nameScreen(false); else home();

})();

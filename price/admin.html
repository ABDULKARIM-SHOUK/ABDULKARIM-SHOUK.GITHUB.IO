<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12332a">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>صفحة المتابعة - رصد أسعار السلع التموينية</title>
<style>
:root{
  --ink:#14272a; --muted:#5b6f72; --line:#dbe5e4; --bg:#f2f6f5; --card:#fff;
  --brand:#1d5a45; --brand-d:#12332a; --brand-l:#e5efe9; --accent:#2f8a62;
  --adm:#12332a; --adm2:#1d4a3a; --gold:#c2a25a;
  --warn:#a86300; --warn-l:#fff3dc; --bad:#b3261e; --bad-l:#fdeceb; --ok:#1a7f4b; --ok-l:#e5f5ec;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"SF Arabic","Segoe UI",Tahoma,"DejaVu Sans",sans-serif;
  font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
main{padding:12px 12px 24px;max-width:640px;margin:0 auto}
body.haspub main{padding-bottom:104px}

/* ---------- الشريط العلوي ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--adm),var(--adm2));color:#fff;padding-top:env(safe-area-inset-top)}
.appbar{display:flex;align-items:center;gap:10px;padding:12px 14px;max-width:640px;margin:0 auto}
.appbar .ttl{flex:1;min-width:0}
.appbar b{display:block;font-size:17px;line-height:1.35}
.appbar small{display:block;opacity:.85;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.pill{flex:none;font-size:11.5px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.18)}

/* ---------- عناصر عامة ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0;font-size:16.5px}
.rowhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.h2{margin:18px 4px 8px;font-size:15px;color:var(--muted);font-weight:700}
.k{font-size:12.5px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 2px 10px;line-height:1.7}
label.f{display:block;margin-bottom:10px;font-size:13.5px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;color:var(--ink);background:#fff}
label.f input,label.f select{height:46px}
label.f textarea{padding:10px 12px;resize:vertical;line-height:1.6}
.req::after{content:" *";color:var(--bad)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(47,138,98,.18)}
.btn{display:block;width:100%;height:50px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:16px}
.btn.ghost{background:#fff;color:var(--brand-d);border:1.5px solid var(--line)}
.btn.warn{background:var(--warn)}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #f0c9c6}
.btn.sm{height:42px;font-size:14.5px;border-radius:12px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.link{border:0;background:none;color:var(--brand);font-size:14px;padding:6px 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tkg{max-height:220px;overflow:auto;border:1px solid var(--line,#e5e2d8);border-radius:10px;padding:4px 10px;margin-top:4px}
.seg2{display:flex;gap:8px;margin-bottom:10px}
.seg2 button{flex:1;height:44px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:700;color:var(--muted)}
.seg2 button.on{background:var(--brand-l);border-color:var(--accent);color:var(--brand-d)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin:6px 0 10px;padding:12px;border-radius:12px;background:var(--brand-l);font-weight:700}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* ---------- التبويبات ---------- */
.tabs{display:flex;gap:8px;margin:2px 0 4px}
.tab{flex:1;height:44px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--brand-l);border-color:var(--accent);color:var(--brand-d)}
.tab:disabled{opacity:.65;cursor:default}
.tab i{font-style:normal;font-size:11px;font-weight:600;background:#eef3f2;border-radius:99px;padding:1px 8px;margin-right:4px;color:var(--muted)}

/* ---------- المجموعات ---------- */
.gcard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;cursor:pointer}
.gno{flex:none;width:46px;height:46px;border-radius:13px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:800;font-size:21px}
.gcard.new .gno{background:var(--accent);color:#fff}
.gmain{flex:1;min-width:0}
.gmain b{display:block;font-size:16.5px}
.gmain small{display:block;color:var(--muted);line-height:1.45;font-size:13px}
.gmeta{font-size:12.5px;color:var(--muted);margin-top:3px}
.chev{flex:none;color:#9fb2b0}
.tg{display:inline-block;font-size:11.5px;line-height:1.6;padding:0 8px;border-radius:99px;margin:3px 0 0 6px;white-space:nowrap;font-weight:600}
.tg.add{background:var(--brand-l);color:var(--brand-d)}
.tg.sea{background:var(--warn-l);color:var(--warn)}
.tg.off{background:#eceff0;color:#5b6a6d}
.tg.out{background:#fff;color:var(--muted);border:1px dashed #b7c9c7}
.tg.ed{background:#e8eefb;color:#2f4a9a}
.ver{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ver b{font-size:15px}
.ver .k{margin-top:2px;line-height:1.6}
.vbadge{flex:none;background:var(--ok-l);color:var(--ok);font-weight:800;border-radius:12px;padding:6px 14px;font-size:17px}

/* ---------- قائمة الأصناف ---------- */
.tools{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 40px 0 12px;font:inherit;background:#fff}
.search svg{position:absolute;right:12px;top:12px;color:var(--muted)}
.seg{display:flex;background:#e6eeed;border-radius:12px;padding:3px;flex:none}
.seg button{border:0;background:transparent;padding:0 12px;height:38px;border-radius:9px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand-d);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.sec{background:#e9f1ec;color:var(--brand-d);font-weight:700;padding:8px 8px 8px 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec small{font-weight:600;color:var(--muted);margin-right:6px}
.sec .sa{display:flex;gap:6px;flex:none}
.mini{height:34px;border:1px solid #c5dbcf;background:#fff;border-radius:99px;padding:0 12px;font-size:13px;color:var(--brand-d)}
.irow{display:grid;grid-template-columns:34px 1fr 42px;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.sec + .irow{border-top:0}
.inum{width:30px;height:30px;border-radius:50%;background:#eef3f2;color:var(--muted);font-size:12.5px;display:grid;place-items:center;align-self:start;margin-top:1px}
.inm{font-size:15px;line-height:1.5;word-break:break-word;min-width:0}
.irow.off .inm .t{color:var(--muted);text-decoration:line-through}
.eb{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:12px;display:grid;place-items:center;color:var(--brand-d)}

/* ---------- لوحة متابعة الإدخال ---------- */
.filters{display:grid;gap:8px;margin-bottom:12px}
.filters .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select{height:44px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:14.5px;background:#fff;padding:0 10px;min-width:0;width:100%}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.upd2{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin:-2px 2px 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 10px 9px}
.kpi b{display:block;font-size:22px;line-height:1.2;color:var(--ink)}
.kpi span{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.kpi.warn b{color:var(--warn)}
.kpi.bad b{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:700;color:var(--muted);font-size:12px;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid #edf2f1;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:left;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .hi{color:var(--bad);font-weight:700}
.tbl .lo{color:#2f4a9a;font-weight:700}
.vrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf2f1;cursor:pointer}
.vrow:first-child{border-top:0}
.vrow .vm{flex:1;min-width:0}
.vrow b{display:block;font-size:15px}
.vrow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.bar{height:6px;border-radius:9px;background:#eef3f2;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.z i{background:#e0a030}
.pill2{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--warn-l);color:var(--warn);margin-left:4px;white-space:nowrap}
.pill2.r{background:var(--bad-l);color:var(--bad)}
.pill2.ok{background:var(--ok-l);color:var(--ok)}
.pill2.ph{background:#e8eefb;color:#2f4a9a}
details.card summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";color:var(--muted);font-weight:400}
details.card[open] summary::after{content:"－"}
.gsub{font-weight:700;color:var(--brand-d);background:#e9f1ec;border-radius:10px;padding:7px 10px;margin:12px 0 4px}
.plink{color:#2f4a9a;font-weight:700;text-decoration:none;white-space:nowrap}
.demo{background:var(--warn-l);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.7;margin-bottom:12px}

/* ---------- الدخول ---------- */
.login{margin-top:30px;text-align:center}
.login .lock{width:64px;height:64px;border-radius:20px;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;margin:0 auto 12px}
.login h2{margin:0 0 4px;font-size:19px}
.login p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.7}
.login input{text-align:center;letter-spacing:6px;font-size:22px;font-weight:700}

/* ---------- السجل ---------- */
.lg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.lg .rowhead b{font-size:15px}
.lg ul{margin:6px 0 0;padding:0 18px 0 0;font-size:13.5px;line-height:1.75;color:#243b3e}

/* ---------- شريط النشر والنوافذ ---------- */
.pubbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(10,50,52,.1);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.pubbar .in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center}
.pubbar .in span{flex:1;font-size:14px;line-height:1.5}
.pubbar .in b{font-size:16px}
.pubbar .btn{width:auto;flex:none;padding:0 22px;height:46px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,30,32,.5);display:flex;align-items:flex-end}
.panel{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.grab{width:42px;height:5px;border-radius:9px;background:#d3dedd;margin:0 auto 12px}
.panel h3{margin:0 0 10px;font-size:18px}
.sbody{font-size:15px;line-height:1.7;color:#243b3e}
.sacts{display:grid;gap:8px;margin-top:14px}
.ferr{background:var(--bad-l);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px}
.chg{margin:6px 0 10px;padding:0 18px 0 0;font-size:14px;line-height:1.8}
.note{background:var(--brand-l);color:var(--brand-d);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.7;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:70;background:#12332a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
body.haspub .toast{bottom:calc(96px + env(safe-area-inset-bottom))}

.nm,.inm .t,.fn,.upd li,.chg li,.lg li{unicode-bidi:isolate;direction:rtl;text-align:right}
bdi{unicode-bidi:isolate}

.official .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px}
.official img{flex:none;order:2;height:78px;width:78px;border-radius:18px;object-fit:contain;background:#fff;padding:7px;border:3px solid #c2a25a;box-shadow:0 0 0 4px rgba(194,162,90,.25)}
.official .tx{flex:1;min-width:0;text-align:right}
.official small{display:block;font-size:12.5px;font-weight:700;color:#d9bf7a;line-height:1.5}
.official span{display:block;font-size:14.5px;color:#e6eeea;line-height:1.5}
.official b{display:block;font-size:clamp(17px,5.1vw,22px);font-weight:800;color:#fff;line-height:1.5;white-space:nowrap}
.appbar:has(#backBtn[hidden]){display:none}
.official b i,.ofoot b i{font-style:normal;color:#e0c57e}
.official em{display:block;font-style:normal;font-size:12.5px;color:#c9d8d1;line-height:1.5}
.official + .top{padding-top:0}
.top{background:linear-gradient(135deg,#12332a,#1d4a3a)!important}
.ofoot{margin-top:18px;background:linear-gradient(120deg,#12332a,#24573f 55%,#16382d);border-top:4px solid #c2a25a;color:#fff;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.ofoot .in{max-width:640px;margin:0 auto;text-align:right}
.ofoot b{display:block;font-size:18px;font-weight:800}
.ofoot span{display:block;margin-top:6px;font-size:13px;color:#d5e2dc;direction:ltr;text-align:left;letter-spacing:.2px}
body.visit .ofoot{display:none}
.ofoot .credit{display:block;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.16);font-style:normal;font-size:12.5px;color:#cfdcd6;line-height:1.7}
.ofoot .credit small{font-size:inherit;white-space:nowrap}
.ofoot .credit bdi{color:#e0c57e;font-weight:700;letter-spacing:.3px}
.vcredit{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 14px;line-height:1.7}
.vcredit bdi{font-weight:700;color:var(--ink);letter-spacing:.3px}
body.haspub .ofoot{margin-bottom:76px}

/* ---------- الحالات، الإنجاز الشهري، التقرير ---------- */
.mrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid #edf2f1}
.mrow:first-of-type{border-top:0}
.mrow .vm{flex:1;min-width:0}
.mrow b{display:block;font-size:15px}
.mrow small{display:block;color:var(--muted);font-size:12.5px}
.pills{display:flex;flex-wrap:wrap;gap:4px 0;justify-content:flex-end;max-width:42%}
.vrow.st{opacity:.75}
.vrow small.why{color:var(--warn)}
.stbox{background:var(--warn-l);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.7;margin-bottom:8px}
.stbox b{display:block}
.btn.sm#weekXl{background:linear-gradient(135deg,#12332a,#1d5a45);box-shadow:inset 0 -3px 0 var(--gold)}
.report .rhead{border-top:4px solid var(--gold)}
.btn.wa{background:#1fa855;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn.wa:active{background:#178a45}
.bcard{border-top:4px solid var(--gold)}
.bhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin:2px 0 6px}
.bnum{font-size:34px;line-height:1.1;display:block;font-variant-numeric:tabular-nums}
.bch{font-size:13px;font-weight:700;color:var(--muted)}
.bch.up{color:#b3261e}.bch.down{color:#1f5fae}
.bsvg{width:min(100%,320px);height:auto;flex:1 1 220px}
.bsvg .b100{stroke:#cfdcd6;stroke-dasharray:3 3}
.bsvg .barea{fill:rgba(194,162,90,.16);stroke:none}
.bsvg .bline{fill:none;stroke:#1d5a45;stroke-width:2.2}
.bsvg .bdot{fill:#c2a25a;stroke:#fff;stroke-width:1.2}
.bsvg .blab{fill:#6b7d77;font-size:10px}

/* ---------- شاشات الكمبيوتر واللابتوب: عرض أوسع، والنوافذ في وسط الشاشة ---------- */
@media (min-width:900px){
  .official{padding:18px 24px}
  .official img{height:92px;width:92px}
  .official b{font-size:28px}
  .official span{font-size:16px}
  .sheet{align-items:center;padding:24px}
  .panel{border-radius:22px;max-height:86vh;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .grab{display:none}
}
@media (min-width:900px){
  main,.appbar,.pubbar .in,.official .in,.ofoot .in{max-width:1240px}
  .tabs{max-width:560px}
  .filters{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center}
  .kpis{grid-template-columns:repeat(9,1fr)}
  .kpi b{font-size:24px}
  /* بطاقات المتابعة في عمودين متجاورين */
  .dash{columns:2;column-gap:14px}
  .dash>*{break-inside:avoid;display:inline-block;width:100%;margin-top:0}
  .dash>details.card{display:block}
  #weekXl,#openRep{max-width:280px}
  .btnrow:has(#weekXl){justify-content:flex-start}
  .panel{max-width:640px}
}
@media (min-width:900px) and (max-width:1150px){ .kpis{grid-template-columns:repeat(5,1fr)} }
/* ---------- التنقل: شريط جانبي في الكمبيوتر، وشريط سفلي في الجوال ---------- */
.snav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(10,50,52,.08);
  display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.snav .nv{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:58px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;border-radius:12px}
.snav .nv svg{width:22px;height:22px}
.snav .nv.on{color:var(--brand-d)}
.snav .nv.on:before{content:"";position:absolute;top:0;width:36px;height:4px;border-radius:0 0 4px 4px;background:var(--gold)}
.snav .nb{position:absolute;top:5px;margin-right:26px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.snav .nb.g{background:var(--gold);color:var(--adm)}
.snav .nfoot{display:none}
body.hasnav{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
body.hasnav .pubbar{bottom:calc(66px + env(safe-area-inset-bottom))}
body.hasnav .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
body.hasnav.haspub .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
.fab{position:fixed;left:16px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:34;height:52px;padding:0 18px;border:0;border-radius:16px;background:var(--gold);color:var(--adm);font-weight:800;font-size:15px;box-shadow:0 8px 20px rgba(18,51,42,.28);display:flex;align-items:center;gap:6px}
body.haspub .fab{bottom:calc(148px + env(safe-area-inset-bottom))}
.card{scroll-margin-top:96px}

/* ---------- ترويسة المتابعة وشريط الأسبوع ---------- */
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;margin:4px 2px 12px}
.mhead .hi{flex:1 1 220px;min-width:0}
.mhead .hi span{font-size:13.5px;color:var(--muted)}
.mhead h1{margin:0;font-size:22px;line-height:1.35;color:var(--adm)}
.mhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.mhead .acts .btn{width:auto;padding:0 16px}
.wband{background:linear-gradient(120deg,var(--adm),#1d5a45);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;border-bottom:4px solid var(--gold);display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
.wband .wm{flex:1 1 260px;min-width:0}
.wband .wm b{font-size:34px;line-height:1}
.wband .wm span{font-size:14.5px;color:#d7e4df;margin-right:8px}
.wband .wbar{height:10px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.wband .wbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.wband small{display:block;font-size:12.5px;color:#c9d8d2;line-height:1.6}
.wband small a,.wband small button{color:#f1dfae;font-weight:700;background:none;border:0;padding:0;font-size:inherit;text-decoration:underline}
.wband .ws{flex:1 1 300px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wband .ws div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.wband .ws b{display:block;font-size:20px}
.wband .ws span{font-size:12px;color:#d7e4df}
.duo{display:flex;flex-wrap:wrap;gap:0 14px;align-items:flex-start}
.duo>.card{flex:1 1 300px;min-width:0}
.duo>.inbox{flex:3 1 380px}
.duo>.bcard{flex:2 1 300px}

/* ---------- يحتاج انتباهك ---------- */
.inbox h3 .cnt{display:inline-block;margin-right:6px;background:var(--bad-l);color:var(--bad);font-size:12.5px;border-radius:99px;padding:0 9px}
.ibx{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #edf2f1}
.ibx:first-of-type{border-top:0}
.ibx .in{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;background:var(--brand-l);color:var(--brand)}
.ibx.bad .in{background:var(--bad-l);color:var(--bad)}
.ibx.warn .in{background:var(--warn-l);color:var(--warn)}
.ibx .tx{flex:1;min-width:0}
.ibx .tx b{display:block;font-size:15px}
.ibx .tx small{display:block;font-size:12.5px;color:var(--muted);line-height:1.6;overflow:hidden;text-overflow:ellipsis}
.ibx .go{height:40px;padding:0 12px;border:1.5px solid #cfe0d8;border-radius:10px;background:#fff;color:var(--brand);font-weight:700;font-size:13.5px;white-space:nowrap;flex:none}
.allok{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700;padding:6px 0}

/* ---------- جدول تخطيط الأسبوع ---------- */
.tview{margin:0 0 12px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.wknav{display:flex;align-items:center;gap:6px}
.wknav b{font-size:15.5px;color:var(--adm);padding:0 4px;white-space:nowrap}
.wknav button{height:38px;min-width:38px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--brand-d);font-weight:700;font-size:13px}
.tacts{display:flex;gap:6px;flex-wrap:wrap}
.tacts .btn{width:auto;padding:0 14px;height:40px;font-size:13.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 2px 8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;border:1.5px solid;vertical-align:-1px;margin-left:5px}
.planwrap{display:flex;flex-direction:column;gap:0}
.board{min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow-x:auto;margin-bottom:12px}
.bgrid{display:grid;grid-template-columns:128px 1.15fr repeat(7,minmax(0,1fr));min-width:880px}
.bgrid .bh{padding:9px 6px;font-size:12.5px;font-weight:700;text-align:center;background:#f7faf9;border-bottom:1px solid var(--line)}
.bgrid .bh.td{background:var(--adm);color:#fff}
.bgrid .bh.wk{background:#fbf6ea;color:#7a5b16}
.bgrid .bn{padding:9px 10px;border-bottom:1px solid #edf2f1;font-size:13.5px}
.bgrid .bn b{display:block}
.bgrid .bn small{display:block;font-size:11.5px;color:var(--muted);line-height:1.5}
.bcell{position:relative;border-bottom:1px solid #edf2f1;border-right:1px solid #f1f5f4;min-height:78px;padding:6px 5px 26px;display:flex;flex-direction:column;gap:5px}
.bcell.tdc{background:#fbfdfc}.bcell.wkc{background:#fffdf7}
.bcell.over{background:#eaf5ef;outline:2px dashed var(--accent);outline-offset:-3px}
.chip{border:1.5px solid var(--brand);background:#fff;border-radius:9px;padding:4px 7px;font-size:12px;line-height:1.45;cursor:pointer;text-align:right}
.chip b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--muted);font-size:11px}
.chip.done{border-color:var(--ok);background:var(--ok-l)}.chip.done b{color:var(--ok)}
.chip.late{border-color:var(--bad);background:var(--bad-l)}.chip.late b{color:var(--bad)}
.chip[draggable=true]{cursor:grab}
.cadd{position:absolute;bottom:4px;left:4px;width:24px;height:22px;border:1px dashed #bcd2c8;border-radius:7px;background:transparent;color:var(--muted);font-size:15px;line-height:1;opacity:.55}
.bcell:hover .cadd,.cadd:focus{opacity:1;border-color:var(--accent);color:var(--brand)}
.sugs{border-top:4px solid var(--gold)}
.sugs .sgl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:18px}
.sugs .sg{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #edf2f1}
.sugs .sg div{flex:1;min-width:0}
.sugs .sg b{display:block;font-size:14px}
.sugs .sg small{font-size:12px;color:var(--muted)}
.sugs .sg button{height:36px;padding:0 12px;border:1.5px solid #cfe0d8;border-radius:10px;background:#fff;color:var(--brand);font-weight:700;font-size:13px;flex:none}
.aplist{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:8px 0}
.aplist div{padding:7px 0;border-top:1px solid #edf2f1;font-size:14px}
.aplist div:first-child{border-top:0}
.aplist small{display:block;color:var(--muted);font-size:12.5px}

@media (min-width:900px){
  main.nav{display:grid;grid-template-columns:228px minmax(0,1fr);column-gap:22px;align-items:start}
  main.nav>*{grid-column:2}
  main.nav>.snav{grid-column:1;grid-row:1/span 40;position:sticky;top:84px;bottom:auto;left:auto;right:auto;z-index:5;
    display:flex;flex-direction:column;gap:4px;padding:12px 10px;background:linear-gradient(170deg,var(--adm),#1a4537);border:0;border-left:4px solid var(--gold);border-radius:18px;box-shadow:0 10px 26px rgba(18,51,42,.18)}
  main.nav>.snav .nv{flex-direction:row;justify-content:flex-start;gap:12px;height:48px;padding:0 14px;color:#dfe9e5;font-size:15px}
  main.nav>.snav .nv:hover{background:rgba(255,255,255,.07)}
  main.nav>.snav .nv.on{background:rgba(194,162,90,.2);color:#f1dfae}
  main.nav>.snav .nv.on:before{display:none}
  main.nav>.snav .nb{position:static;margin:0 auto 0 0}
  main.nav>.snav .nfoot{display:block;margin-top:10px;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#a9bfb7;line-height:1.7}
  main.nav>.snav .nfoot button{width:100%;height:42px;margin-bottom:8px;border:0;border-radius:11px;background:var(--gold);color:var(--adm);font-weight:800;font-size:14px}
  body.hasnav{padding-bottom:0}
  body.hasnav .pubbar{bottom:0}
  body.hasnav .toast{bottom:calc(24px + env(safe-area-inset-bottom))}
  body.hasnav.haspub .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
  .fab{display:none}
  main.nav .tabs{display:none}
  .mhead h1{font-size:26px}
}

@media (min-width:1600px){ .dash{columns:3} }
.report .rhead h2{margin:0 0 4px;font-size:18px}
.report .kpis{grid-template-columns:repeat(3,1fr)}
@media print{
  .top,.pubbar,.toast,.sheet,.noprint,.tabs,.link,.chev,.snav,.fab{display:none!important}
  body{background:#fff}
  .official,.ofoot,.kpi,.pill2,.bar i,.report .rhead{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ofoot{margin-top:8px}
  main{max-width:none;padding:0 4px}
  .card,.kpi{break-inside:avoid;border-color:#cfd8d4}
  .report .kpis{grid-template-columns:repeat(5,1fr)}
  .dash{columns:1}
  .tbl{font-size:12px}
  @page{size:A4;margin:10mm}
}

/* ---------- بطاقة تثبيت التطبيق ---------- */
.instbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:45;max-width:460px;margin:0 auto;display:flex;gap:10px;align-items:center;
  background:linear-gradient(120deg,#12332a,#1d5a45);color:#fff;border-radius:16px;padding:10px 12px;border-bottom:3px solid #c2a25a;box-shadow:0 10px 28px rgba(10,40,32,.3)}
.instbar img{width:44px;height:44px;border-radius:11px;flex:none}
.instbar div{flex:1;min-width:0}.instbar b{display:block;font-size:14.5px;line-height:1.4}.instbar small{display:block;font-size:12px;color:#d7e4df;line-height:1.5}
.instbar .instgo{height:40px;padding:0 14px;border:0;border-radius:10px;background:#c2a25a;color:#12332a;font-weight:800;font-size:14px;flex:none}
.instbar .instx{width:32px;height:40px;border:0;background:none;color:#c9d8d2;font-size:22px;flex:none}
body.visit .instbar,body.hasnav .instbar{bottom:calc(86px + env(safe-area-inset-bottom))}
.instov{position:fixed;inset:0;z-index:90;background:rgba(10,30,25,.55);display:flex;align-items:flex-end;justify-content:center}
.instsh{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom));color:#14272a}
.instgr{display:block;width:44px;height:5px;border-radius:9px;background:#d5dedb;margin:0 auto 14px}
.insthd{display:flex;gap:12px;align-items:center;margin-bottom:10px}.insthd img{width:54px;height:54px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.insthd b{display:block;font-size:18px;color:#12332a}.insthd small{font-size:13px;color:#5b6f72}
.inststep{display:flex;gap:12px;padding:11px 0;border-top:1px solid #edf2f1}
.inststep>span{width:30px;height:30px;border-radius:50%;background:#e5efe9;color:#1d5a45;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.inststep b{display:block;font-size:15px}.inststep small{font-size:13px;color:#5b6f72}
.instok{width:100%;height:50px;margin-top:12px;border:0;border-radius:14px;background:#1d5a45;color:#fff;font-weight:800;font-size:16px}
@media print{.instbar,.instov{display:none!important}}
</style>

function diffCats(pub, work) {
  const out = [], pm = new Map(pub.map(g => [g.id, g]));
  const sea = o => o.from && o.to ? ` (موسمي ${fmtD(o.from)}–${fmtD(o.to)})` : "";
  const names = a => a.slice(0, 3).join("، ") + (a.length > 3 ? ` و${a.length - 3} أخرى` : "");
  work.forEach(g => {
    const p = pm.get(g.id), cnt = allItems(g).length;
    if (!p) { out.push(`إضافة مجموعة جديدة «${g.title}» (${cnt} صنفاً)${sea(g)}`); return; }
    if (g.title !== p.title) out.push(`تغيير اسم المجموعة «${p.title}» إلى «${g.title}»`);
    if ((g.subtitle || "") !== (p.subtitle || "")) out.push(`تعديل وصف المجموعة «${g.title}»`);
    if ((g.active !== false) !== (p.active !== false)) out.push(g.active === false ? `إيقاف المجموعة «${g.title}»` : `إعادة تفعيل المجموعة «${g.title}»`);
    if ((g.from || "") !== (p.from || "") || (g.to || "") !== (p.to || "")) out.push(g.from && g.to ? `جعل المجموعة «${g.title}» موسمية${sea(g)}` : `جعل المجموعة «${g.title}» دائمة`);
    const ps = new Map(p.sections.map(s => [s.id, s])), pi = new Map();
    p.sections.forEach(s => s.items.forEach(i => pi.set(i.n, { i, s })));
    g.sections.forEach(s => {
      const o = ps.get(s.id);
      if (!o) out.push(`إضافة قسم «${s.name}» في «${g.title}»`);
      else if (o.name !== s.name) out.push(`تغيير اسم القسم «${o.name}» إلى «${s.name}»`);
    });
    p.sections.forEach(s => { if (!g.sections.some(x => x.id === s.id)) out.push(`حذف القسم «${s.name}» من «${g.title}»`); });
    const added = [];
    g.sections.forEach(s => s.items.forEach(i => {
      const o = pi.get(i.n);
      if (!o) { added.push(`${i.t}${sea(i)}`); return; }
      if (i.t !== o.i.t) out.push(`تصحيح اسم صنف في «${g.title}»: «${o.i.t}» ← «${i.t}»`);
      if (!!i.off !== !!o.i.off) out.push(`${i.off ? "إيقاف" : "إعادة تفعيل"} الصنف «${i.t}»`);
      if ((i.from || "") !== (o.i.from || "") || (i.to || "") !== (o.i.to || "")) out.push(i.from && i.to ? `جعل الصنف «${i.t}» موسمياً (${fmtD(i.from)}–${fmtD(i.to)})` : `جعل الصنف «${i.t}» دائماً`);
      if (o.s.id !== s.id) out.push(`نقل الصنف «${i.t}» إلى قسم «${s.name}»`);
    }));
    if (added.length) out.push(`إضافة ${added.length === 1 ? "صنف" : added.length + " أصناف"} إلى «${g.title}»: ${names(added)}`);
  });
  return out;
}

function saveItem(g, item) {
  const edit = !!item, ls = edit ? lines($("#i_name").value).slice(0, 1) : lines($("#i_name").value);
  if (!ls.length) return "اكتب اسم الصنف";
  const kind = $("#i_kind .on").dataset.k, from = $("#i_from").value, to = $("#i_to").value, season = $("#i_season").value.trim();
  const de = dateErr(kind, from, to); if (de) return de;

  if ($("#i_sec").value === "__new") {
    const nm = $("#i_newsec").value.trim(); if (!nm) return "اكتب اسم القسم الجديد";
    sec = { id: "s" + uid(), name: nm, items: [] };
  } else sec = g.sections.find(s => s.id === $("#i_sec").value);
  const seen = new Set();
  for (const t of ls) {
    if (dupName(g, t, edit ? item.n : -1) || seen.has(norm(t))) return `الصنف «${t}» موجود مسبقاً في هذه المجموعة`;
    seen.add(norm(t));
  }
  if (!g.sections.includes(sec) && sec.items.length === 0) g.sections.push(sec);
  const dates = kind === "sea" ? { from, to, ...(season ? { season } : {}) } : {};
  if (!edit) {
    ls.forEach(t => sec.items.push({ n: nextN(g), t, ...(g.added ? {} : { added: true }), ...dates }));
    toast(ls.length === 1 ? "أُضيف الصنف (لم يُنشر بعد)" : `أُضيفت ${ls.length} أصناف (لم تُنشر بعد)`);
  } else {
    const t = ls[0], oldSec = g.sections.find(s => s.items.includes(item));
    if (t !== item.t) {

      item.t = t;
      if (item.was === t) delete item.was;
    }
    delete item.from; delete item.to; delete item.season; Object.assign(item, dates);
    if ($("#i_on").checked) delete item.off; else item.off = true;
    if (oldSec !== sec) { oldSec.items = oldSec.items.filter(i => i !== item); sec.items.push(item); }
    toast("حُفظ التعديل (لم يُنشر بعد)");
  }

function saveGroup(g) {
  const title = $("#g_title").value.trim(); if (!title) return "اكتب اسم المجموعة";
  if (W.groups.some(x => x !== g && norm(x.title) === norm(title))) return "توجد مجموعة بهذا الاسم";
  const kind = $("#g_kind .on").dataset.k, from = $("#g_from").value, to = $("#g_to").value;
  const de = dateErr(kind, from, to); if (de) return de;
  const dates = kind === "sea" ? { from, to } : {};
  if (g) {
    g.title = title; g.subtitle = $("#g_sub").value.trim(); delete g.from; delete g.to; Object.assign(g, dates);
    if ($("#g_on").checked) delete g.active; else g.active = false;
    saveWork(); render(); return toast("حُفظ التعديل (لم يُنشر بعد)");
  }
  const secName = $("#g_sec").value.trim(); if (!secName) return "اكتب اسم القسم الأول";
  const ls = lines($("#g_items").value), seen = new Set();
  for (const t of ls) { if (seen.has(norm(t))) return `الصنف «${t}» مكرر`; seen.add(norm(t)); }
  const ng = { id: nextGid(), title, subtitle: $("#g_sub").value.trim(), added: true, sections: [{ id: "s" + uid(), name: secName, items: ls.map((t, i) => ({ n: i + 1, t })) }], ...dates };
  W.groups.push(ng); saveWork(); toast("أُنشئت المجموعة (لم تُنشر بعد)");
  go("#/g/" + ng.id);
}

/* ---------- نوافذ القسم والنشر ---------- */
/* القسم يُحذف إذا كان فارغاً أو كل أصنافه لم تُنشر بعد. القسم الذي فيه أصناف منشورة لا يُحذف
   حتى لا تضيع أسعارها السابقة، ويمكن إيقاف أصنافه كلها فيختفي عند المراقبين، أو نقلها لقسم آخر. */
function secSheet(g, sec) {
  const published = sec ? sec.items.filter(i => !isNewItem(g, i.n)) : [];
  const canDelete = sec && !published.length;
  const allOff = sec && sec.items.length && sec.items.every(i => i.off);
  openSheet(sec ? "تعديل القسم" : "إضافة قسم", `<label class="f"><span class="req">اسم القسم</span><input id="s_name" value="${esc(sec ? sec.name : "")}" autocomplete="off"></label>
    ${sec && !canDelete ? `<div class="hint">في هذا القسم ${(n => n === 1 ? "صنف واحد منشور" : n === 2 ? "صنفان منشوران" : n <= 10 ? n + " أصناف منشورة" : n + " صنفاً منشوراً")(published.length)}، فلا يُحذف حتى لا تضيع أسعارها السابقة. يمكنك إيقاف أصنافه كلها فيختفي القسم عند المراقبين، أو نقل أصنافه إلى قسم آخر من زر التعديل بجانب كل صنف.</div>` : ""}`, [
    { t: "حفظ", fn: () => {
      const nm = $("#s_name").value.trim(); if (!nm) return "اكتب اسم القسم";
      if (g.sections.some(s => s !== sec && norm(s.name) === norm(nm))) return "يوجد قسم بهذا الاسم";
      if (sec) sec.name = nm; else g.sections.push({ id: "s" + uid(), name: nm, items: [] });
      saveWork(); render(); toast(sec ? "حُفظ الاسم" : "أُضيف القسم، أضف إليه أصنافاً");
    } },
    ...(canDelete ? [{ t: sec.items.length ? `حذف القسم و${sec.items.length === 1 ? "صنفه" : "أصنافه"} (${sec.items.length})` : "حذف القسم", cls: "danger", fn: () => { closeSheet(); setTimeout(() => delSecSheet(g, sec), 0); return null; } }] : []),
    ...(sec && !canDelete ? [{ t: allOff ? "إعادة تفعيل أصناف القسم" : "إيقاف كل أصناف القسم", cls: "warn", fn: () => {
      sec.items.forEach(i => { if (allOff) delete i.off; else i.off = true; });
      saveWork(); render(); toast(allOff ? "أُعيد تفعيل أصناف القسم (لم يُنشر بعد)" : "أُوقفت أصناف القسم (لم يُنشر بعد)");
    } }] : []),
    { t: "إلغاء", cls: "ghost" }
  ]);
}
function delSecSheet(g, sec) {
  openSheet("حذف القسم", `سيُحذف قسم «${esc(sec.name)}»${sec.items.length ? ` ومعه ${sec.items.length} صنفاً لم تُنشر بعد` : ""}. هل تريد المتابعة؟`, [
    { t: "نعم، احذف", cls: "warn", fn: () => { g.sections = g.sections.filter(s => s !== sec); saveWork(); render(); toast("حُذف القسم (لم يُنشر بعد)"); } },
    { t: "رجوع", cls: "ghost" }

}

    { t: "نشر للمراقبين", fn: publish },

  const ch = changes(), p = pubCat();

async function setVisitStatus(v, action, reason) {

async function exportWeek(ws) {

  }

  const hidden = () => { try { return +localStorage.getItem(HIDE) > Date.now(); } catch (e) { return false; } };
  let deferred = null;
  const remove = () => { const b = document.getElementById("instBar"); if (b) b.remove(); };
  function steps() {
    const o = document.createElement("div"); o.className = "instov"; o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "تثبيت " + APP.name);
    o.innerHTML = `<div class="instsh"><span class="instgr"></span>
      <div class="insthd"><img src="${APP.icon}" alt=""><div><b>تثبيت على آيفون</b><small>من متصفح Safari</small></div></div>
      ${[["اضغط زر المشاركة", "المربع والسهم للأعلى، أسفل الشاشة"], ["اختر «إضافة إلى الشاشة الرئيسية»", "ثم «إضافة» أعلى الشاشة"], ["افتح «" + APP.name + "» من الشاشة الرئيسية", "يفتح كتطبيق ويحفظ دخولك"]]
        .map((s, i) => `<div class="inststep"><span>${i + 1}</span><div><b>${s[0]}</b><small>${s[1]}</small></div></div>`).join("")}
      <button type="button" class="instok">فهمت</button></div>`;
    o.addEventListener("click", e => { if (e.target === o || e.target.closest(".instok")) o.remove(); });
    document.body.appendChild(o);
  }
  function show() {
    if (standalone() || hidden() || document.getElementById("instBar") || (!deferred && !iOS)) return;
    const b = document.createElement("div"); b.id = "instBar"; b.className = "instbar";
    b.innerHTML = `<img src="${APP.icon}" alt=""><div><b>ثبّت «${APP.name}» على جوالك</b><small>يفتح كتطبيق بملء الشاشة ويعمل دون إنترنت</small></div>
      <button type="button" class="instgo">تثبيت</button><button type="button" class="instx" aria-label="إخفاء">×</button>`;
    b.addEventListener("click", async e => {
      if (e.target.closest(".instx")) { try { localStorage.setItem(HIDE, Date.now() + 14 * 864e5); } catch (x) {} return remove(); }
      if (!e.target.closest(".instgo")) return;
      if (deferred) { deferred.prompt(); const r = await deferred.userChoice.catch(() => null); deferred = null; if (r && r.outcome === "accepted") remove(); }
      else steps();
    });
    document.body.appendChild(b);
  }
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; show(); });
  window.addEventListener("appinstalled", remove);
  if (iOS) setTimeout(show, 2500);
  window.__showInstall = () => { if (deferred) show(); else if (iOS) steps(); };
})();
</script>
